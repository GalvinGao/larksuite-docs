name: Publish fetcher release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-fetcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASSET_NAME: open-larksuite-docs-x86_64-unknown-linux-gnu

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Test the fetcher
        run: cargo +stable test --locked --all-features

      - name: Build the fetcher
        run: cargo +stable build --locked --release

      - name: Package the release asset
        run: |
          mkdir dist
          cp target/release/open-larksuite-docs "dist/${ASSET_NAME}"
          cd dist
          sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="main-${GITHUB_SHA::12}"
          gh release create "${TAG_NAME}" \
            "dist/${ASSET_NAME}" \
            "dist/${ASSET_NAME}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Main build ${GITHUB_SHA::12}" \
            --notes "Automated Linux x86_64 build from main at ${GITHUB_SHA}." \
            --latest
