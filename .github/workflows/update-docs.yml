name: Update documentation mirror

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-documentation-mirror
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ASSET_NAME: open-larksuite-docs-x86_64-unknown-linux-gnu
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download the latest fetcher release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/fetcher"
          gh release download \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ASSET_NAME}" \
            --pattern "${ASSET_NAME}.sha256" \
            --dir "${RUNNER_TEMP}/fetcher"
          cd "${RUNNER_TEMP}/fetcher"
          sha256sum --check "${ASSET_NAME}.sha256"
          chmod +x "${ASSET_NAME}"

      - name: Refresh the mirror
        run: |
          rm -rf docs
          "${RUNNER_TEMP}/fetcher/${ASSET_NAME}" --output docs

      - name: Commit and push upstream changes
        run: |
          git add --all -- docs

          if git diff --cached --quiet; then
            echo "The Lark documentation mirror is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Lark documentation mirror"
          git push origin "HEAD:${DEFAULT_BRANCH}"
