name: Update documentation mirror

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-documentation-mirror
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Test the fetcher
        run: cargo +stable test --locked --all-features

      - name: Refresh the mirror
        run: |
          rm -rf docs
          cargo +stable run --locked --release -- --output docs

      - name: Commit and push upstream changes
        run: |
          git add --all -- docs

          if git diff --cached --quiet; then
            echo "The Lark documentation mirror is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Lark documentation mirror"
          git push origin "HEAD:${DEFAULT_BRANCH}"
